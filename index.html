<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florista Violeta · Orçamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --violet-deep: #3B1E45;
    --violet: #7C4A94;
    --violet-pale: #EADCF2;
    --paper: #FAF6FB;
    --paper-dim: #EFE4F4;
    --gold: #C99A32;
    --ink: #241726;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 64px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(59,30,69,0.06) 0, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(201,154,50,0.08) 0, transparent 45%);
  }
  .page{ width:100%; max-width: 420px; position: relative; }

  /* ---------- Language gate ---------- */
  .lang-gate{
    position: fixed;
    inset: 0;
    background: var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 22px;
    z-index: 50;
    padding: 24px;
    text-align:center;
  }
  .lang-gate img{ width: 180px; height:auto; margin-bottom: 4px; }
  .lang-gate p{
    color: var(--violet-pale);
    font-family: 'Fraunces', serif;
    font-size: 19px;
    margin: 0;
  }
  .lang-choices{ display:flex; gap: 12px; }
  .lang-choices button{
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 4px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .lang-choices button:hover{ background: var(--gold); color: var(--violet-deep); }

  .hidden{ display:none !important; }

  /* ---------- Header ---------- */
  .lang-switch{
    position:absolute;
    top: 0;
    right: 0;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--violet);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration: underline;
    padding: 4px;
  }

  header{ text-align:center; margin-bottom: 20px; }
  header img.logo{ width: 190px; height:auto; margin-bottom: 6px; }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--violet);
    font-weight: 600;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 28px;
    margin: 6px 0 8px;
    color: var(--violet-deep);
  }
  .sub{
    font-size: 14px;
    color: #5b5061;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto;
  }

  .address{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12.5px;
  }
  .address a{
    color: var(--violet);
    text-decoration: none;
    border-bottom: 1px solid var(--violet-pale);
  }
  .address a:hover{ border-bottom-color: var(--violet); }
  .address svg{ width:13px; height:13px; flex-shrink:0; fill: var(--gold); }

  .step-label{
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--violet);
    font-weight: 600;
    margin: 26px 0 12px;
  }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border: 1px solid var(--paper-dim);
    border-radius: 4px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }
  .opt:hover{ border-color: var(--gold); }
  .opt:active{ transform: scale(0.99); }
  .opt.selected{
    border-color: var(--violet-deep);
    background: #fdfbfe;
    box-shadow: inset 3px 0 0 var(--violet-deep);
  }
  .opt-name{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--ink);
  }
  .opt-hint{
    display:block;
    font-family: 'Work Sans', sans-serif;
    font-size: 12px;
    color: #8a7f8f;
    margin-top: 2px;
  }
  .opt-base{
    font-size: 13px;
    color: var(--violet);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ---------- Quantity ---------- */
  .qty-block{
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity .3s ease, max-height .3s ease;
  }
  .qty-block.show{ opacity:1; max-height: 140px; }
  .qty-row{
    display:flex;
    align-items:center;
    justify-content: center;
    gap: 18px;
    background: var(--paper-dim);
    border-radius: 4px;
    padding: 10px 16px;
  }
  .qty-row button{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--violet);
    background: #fff;
    color: var(--violet-deep);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease;
  }
  .qty-row button:hover{ background: var(--violet-pale); }
  .qty-row button:active{ transform: scale(0.95); }
  .qty-value{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    min-width: 24px;
    text-align: center;
    color: var(--ink);
  }

  /* ---------- Price ticket (signature element) ---------- */
  .tag{
    margin-top: 24px;
    position: relative;
    background: var(--violet-deep);
    color: var(--paper);
    border-radius: 6px;
    padding: 26px 24px 22px;
    text-align: center;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity .35s ease, max-height .35s ease, padding .35s ease;
  }
  .tag.show{
    opacity: 1;
    max-height: 300px;
    padding: 26px 24px 22px;
  }
  .tag::before{
    content: "";
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 14px;
    height: 14px;
    background: var(--violet-deep);
    border-radius: 2px;
  }
  .tag::after{
    content: "";
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--paper);
  }
  .tag-label{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  .tag-qty{
    font-size: 12.5px;
    color: #d9cce0;
    margin-top: 4px;
  }
  .tag-range{
    font-family: 'Fraunces', serif;
    font-size: 32px;
    margin: 6px 0 4px;
  }
  .tag-note{
    font-size: 12px;
    color: #d9cce0;
  }

  .whatsapp-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    background: var(--gold);
    color: var(--violet-deep);
    border: none;
    border-radius: 4px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
  }
  .whatsapp-btn.show{ opacity:1; max-height:80px; margin-top:18px; }
  .whatsapp-btn:hover{ background: #b98c2c; }
  .whatsapp-btn:active{ transform: scale(0.98); }
  .whatsapp-btn svg{ width:18px; height:18px; flex-shrink:0; fill: var(--violet-deep); }

  footer{
    text-align:center;
    margin-top: 40px;
    font-size: 11px;
    color: #a396a8;
  }

  @media (prefers-reduced-motion: reduce){
    .tag, .whatsapp-btn, .opt, .qty-block{ transition: none; }
  }
</style>
</head>

  };
  // Inject the shop address text into both language packs.
  translations.pt.address = SHOP_ADDRESS_TEXT;
  translations.en.address = SHOP_ADDRESS_TEXT;

  document.querySelector('.address a').setAttribute('href', SHOP_MAPS_URL);

  let currentLang = 'pt';
  let selected = null;
  let qty = 1;

  const langGate = document.getElementById('langGate');
  const mainPage = document.getElementById('mainPage');
  const langSwitch = document.getElementById('langSwitch');
  const options = document.querySelectorAll('.opt');
  const qtyBlock = document.getElementById('qtyBlock');
  const qtyValue = document.getElementById('qtyValue');
  const tag = document.getElementById('tag');
  const tagRange = document.getElementById('tagRange');
  const tagQty = document.getElementById('tagQty');
  const waBtn = document.getElementById('waBtn');

  function applyLang(lang){
    currentLang = lang;
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });
    langSwitch.textContent = lang === 'pt' ? 'EN' : 'PT';
    document.documentElement.lang = lang;
    if (selected) updateTag();
  }

  document.querySelectorAll('.lang-choices button').forEach(btn => {
    btn.addEventListener('click', () => {
      applyLang(btn.dataset.lang);
      langGate.classList.add('hidden');
      mainPage.classList.remove('hidden');
    });
  });

  langSwitch.addEventListener('click', () => {
    applyLang(currentLang === 'pt' ? 'en' : 'pt');
  });

  function formatEuro(n){
    return n.toFixed(2).replace('.', ',') + '€';
  }

  function updateTag(){
    if(!selected) return;
    const base = selected.base;
    const low = base * qty * (1 - selected.lowPct/100);
    const high = base * qty * (1 + selected.highPct/100);
    const t = translations[currentLang];
    tagRange.textContent = formatEuro(low) + ' – ' + formatEuro(high);
    tagQty.textContent = qty + ' ' + t.qtyWord + ' · ' + selected.name;
  }

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      options.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');

      const key = opt.dataset.key;
      const t = translations[currentLang];
      selected = {
        key,
        name: t[key + '_name'],
        base: parseFloat(opt.dataset.base),
        lowPct: parseFloat(opt.dataset.low),
        highPct: parseFloat(opt.dataset.high)
      };
      qty = 1;
      qtyValue.textContent = qty;

      updateTag();
      qtyBlock.classList.add('show');
      tag.classList.add('show');
      waBtn.classList.add('show');
    });
  });

  document.getElementById('qtyMinus').addEventListener('click', () => {
    if (qty > 1){ qty--; qtyValue.textContent = qty; updateTag(); }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    if (qty < 99){ qty++; qtyValue.textContent = qty; updateTag(); }
  });

  waBtn.addEventListener('click', () => {
    if(!selected) return;
    const base = selected.base;
    const low = base * qty * (1 - selected.lowPct/100);
    const high = base * qty * (1 + selected.highPct/100);
    const t = translations[currentLang];
    const name = t[selected.key + '_name'];
    const message = t.waMessage(name, qty, formatEuro(low), formatEuro(high));
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
